<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>保險客戶追蹤系統</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="root"></div>
<div id="boot-error" style="display:none; font-family: -apple-system, sans-serif; padding: 20px; color: #b91c1c; background: #fef2f2; white-space: pre-wrap; word-break: break-word;"></div>
<script>
  function showBootError(msg) {
    var el = document.getElementById("boot-error");
    el.style.display = "block";
    el.textContent += (el.textContent ? "\n\n" : "") + msg;
  }
  window.addEventListener("error", function (e) {
    showBootError("錯誤: " + e.message + (e.filename ? ("\n位置: " + e.filename + ":" + e.lineno) : ""));
  });
  setTimeout(function () {
    if (typeof React === "undefined") showBootError("React 沒有載入成功(unpkg react.production.min.js)");
    if (typeof ReactDOM === "undefined") showBootError("ReactDOM 沒有載入成功(unpkg react-dom.production.min.js)");
    var rootEl = document.getElementById("root");
    if (rootEl && rootEl.innerHTML.trim() === "" && document.getElementById("boot-error").textContent.trim() === "") {
      showBootError("畫面是空的,但沒有偵測到明顯的載入錯誤,可能是程式執行時的錯誤(請截圖這個畫面給我)。");
    }
  }, 3000);
</script>
<script src="app.js"></script>
</body>
</html>
